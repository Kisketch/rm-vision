%YAML:1.0
---
# Historical N0 configuration for 3.avi / 4.avi offline regression only.
# Assumed pinhole intrinsics (2400,2400,720,540), zero distortion, 25 m/s.
# This is a reproducibility fixture, not calibration for any robot camera.
# Based on current default.yaml; only camera intrinsics/distortion and 17 mm
# bullet speed differ. Keep this fixture explicit when comparing BASELINE.md.
camera:
   fx: 2400.
   fy: 2400.
   cx: 720.
   cy: 540.
   dist: [ 0., 0., 0., 0., 0. ]
   pitch_deg: 0.          # tuned: -6..+6 swept, 0 is within noise of the best

detector:
   enemy_color: "red"
   channel_diff_threshold: 70
   min_light_length: 8.
   min_light_aspect: 1.6
   max_light_aspect: 12.
   min_fill_ratio: 0.4
   max_light_tilt_deg: 40.
   max_pair_angle_diff_deg: 12.
   max_length_ratio: 1.7
   max_center_y_diff: 0.6
   min_gap_ratio: 0.15
   max_gap_ratio: 3.2
   min_plate_ratio: 1.1
   max_plate_ratio: 5.0
   large_plate_ratio: 3.2
   reject_contained_lights: 1
   refine_corners: 1
   classify_threshold: 0.7
   ignore_classes: [ "negative" ]
   backend: "traditional"   # "onnx" enables the YOLO-pose keypoint backend (B-02)
   onnx_path: ""            # path to the exported pose model, e.g. model/armor_pose.onnx
   keypoint_conf: 0.25
   keypoint_nms: 0.45

pose:
   optimize_yaw: 1
   armor_pitch_deg: 15.
   yaw_search_range_deg: 85.
   # Self-calibrated: two plates of one robot seen together must be 90 deg apart;
   # measured 69.3 deg (video 3, 248 frames) and 69.7 deg (video 4, 542 frames).
   yaw_gain: 1.3

tracker:
   carry_velocity: 1      # infantry behaviour (explicit since the rm-vision merge)
   armors_num: 4
   max_match_distance: 0.35
   max_match_yaw_diff: 1.0
   tracking_thres: 3
   lost_time_thres: 0.4
   q_xyz: 1.0             # tuned (adaptive, see q_adapt_max)
   q_yaw: 3.             # tuned: visible plateau q_yaw 2-4 (README, tuning log H/J)
   q_r: 3.0e-3           # radius process noise: apparent size changes when approaching
   q_dz: 1.0e-4
   pixel_noise: 1.0
   r_yaw: 0.01            # tuned: measured yaw scatter is ~5 deg
   r_yaw_head_on: 0.02
   init_radius: 0.25
   min_radius: 0.12
   max_radius: 0.4
   q_adapt_max: 20.
   nis_ema_alpha: 0.2
   # Singer velocity damping. Tuned on the two videos (sweep in README):
   # 0.3 s gives 66.6% / 65.4% (video 3 / video 4) vs 62.5% / 59.6% for the
   # constant-velocity model. The synthetic simulator prefers CV because its
   # strafing is a smooth sinusoid; the real robot reverses direction often.
   singer_tau: 0.3

ballistic:
   bullet_speed: 25.  # offline N0 assumption, not a gun measurement
   gravity: 9.8
   drag_k: 0.019          # 17 mm: 0.5 * 1.169 * 0.47 * pi*0.0084^2 / 0.0032
   use_drag: 1
   bullet_mm: 17          # projectile class: 17, or 42 for the hero
   bullet_speed_42: 16.   # 42 mm placeholder - measure before use
   drag_k_42: 0.009       # 42 mm: same formula, m = 0.042 kg, r = 0.021 m

aimer:
   latency: 0.06
   yaw_offset_deg: 0.         # fixed mechanical zero offset; legacy code measured +0.5 in its own convention - re-measure before setting
   pitch_offset_deg: 0.       # legacy measured -0.5 in its own convention - re-measure before setting
   side_angle_deg: 20.        # tuned: higher = fewer but surer shots
   switch_hysteresis_deg: 3. # stay on the current plate unless the next is 3 deg better
   min_switch_omega: 1.0
   max_fire_facing_deg: 30.   # tuned: 15 -> 69% / 6.3 hits/s, 30 -> 63% / 9.0, 50 -> 58% / 10.7 (video 3)
   center_mode_omega: 12.     # armor mode matched or beat centre mode up to 10 rad/s
   center_fire_window_deg: 15.
   fire_tolerance_scale: 0.9
   fire_sigma_scale: 0.       # covariance fire gate; off: Q is tuned for response, not calibrated
   gimbal_tau: 0.03
   gimbal_max_rate: 12.

eval:
   fps: 25.
   horizons: [ 0.12, 0.2, 0.32 ]
