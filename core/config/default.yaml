%YAML:1.0
---
# Default parameters. Values marked "tuned" were chosen with
#   autoaim_video <video> --sweep key=v1,v2,...   (both test videos)
#   autoaim_sim --set key=value                    (ground-truth scenarios)
# see README.md, section "Tuning log".

# Camera intrinsics: MEASURED calibration of the team's camera, imported
# 2026-11-10 from the legacy on-robot code (auto-aim-master/text.yaml), which
# ran with these values. dist is copied in the legacy stored order, which the
# legacy solver passes to solvePnP unchanged; note the legacy order may be
# (k1, k2, k3, p1, p2) rather than OpenCV's (k1, k2, p1, p2, k3) - confirm
# against the calibration script before re-deriving anything from it.
# The legacy extrinsics ARE representable now (R_cam2gimbal / t_cam2gimbal
# below, added 2026-11-10) but are deliberately NOT enabled: the legacy
# R_camera2gimbal axis permutation [0,0,1; -1,0,0; 0,-1,0] and lever arm
# t = [0.10, -0.05, 0] m are expressed in the legacy code's frame
# convention, which must be verified against this repo's gimbal frame on
# the robot before use. To enable after verification, uncomment:
#   R_cam2gimbal: [ 0., 0., 1., -1., 0., 0., 0., -1., 0. ]
#   t_cam2gimbal: [ 0.10, -0.05, 0. ]
camera:
   fx: 2399.5837
   fy: 2398.5972
   cx: 688.7026
   cy: 533.4234
   dist: [ 0.002592988512527, 0.048045410117226, 0.293333651684761, 0.0001643665962815789, 0.0001925868649099913 ]
   pitch_deg: 0.          # tuned: -6..+6 swept, 0 is within noise of the best

detector:
   enemy_color: "red"
   channel_diff_threshold: 70
   min_light_length: 8.
   min_light_aspect: 1.6
   max_light_aspect: 12.
   min_fill_ratio: 0.4
   max_light_tilt_deg: 40.
   max_pair_angle_diff_deg: 12.
   max_length_ratio: 1.7
   max_center_y_diff: 0.6
   min_gap_ratio: 0.15
   max_gap_ratio: 3.2
   min_plate_ratio: 1.1
   max_plate_ratio: 5.0
   large_plate_ratio: 3.2
   reject_contained_lights: 1
   reject_horizontal_lights: 1   # lying-down blobs are not bars (docs/studies/split_light_merge.md)
   merge_split_lights: 1         # heal bars split by a saturated core (docs/studies/split_light_merge.md)
   merge_max_gap_ratio: 0.5
   refine_corners: 1
   classify_threshold: 0.7
   ignore_classes: [ "negative" ]
   backend: "traditional"   # "onnx" enables the YOLO-pose keypoint backend (B-02)
   onnx_path: ""            # path to the exported pose model, e.g. model/armor_pose.onnx
   keypoint_conf: 0.25
   keypoint_nms: 0.45

pose:
   max_reproj_error_px: 0.  # 0 = diagnostic only; select a gate using labelled data
   optimize_yaw: 1
   armor_pitch_deg: 15.
   yaw_search_range_deg: 85.
   # Self-calibrated: two plates of one robot seen together must be 90 deg apart;
   # measured 69.3 deg (video 3, 248 frames) and 69.7 deg (video 4, 542 frames),
   # so the gain is 90 / ~69.5 = 1.3. Caveat: the measurement comes from those
   # two recordings only - re-measure it when the camera or its mount changes,
   # and do not treat 1.3 as a universal constant.
   yaw_gain: 1.3

tracker:
   carry_velocity: 1      # infantry behaviour (explicit since the rm-vision merge)
   armors_num: 4
   max_match_distance: 0.35
   max_match_yaw_diff: 1.0
   tracking_thres: 3
   lost_time_thres: 0.4
   # Consecutive unmatched frames still counted as TRACKING. 0 keeps the old
   # rule. Raising it buys shots/s at the cost of hit rate (swept: 0 -> 58.2% /
   # 9.03, 2 -> 56.9% / 9.63 on video 3), so the shipped default stays 0.
   lost_grace_frames: 0
   q_xyz: 1.0             # tuned (adaptive, see q_adapt_max)
   # Stage K: the yaw process noise is split into an angular-rate term (q_yaw)
   # and a phase random walk (q_yaw_walk). One parameter could not express the
   # two requirements at once: the angle must stay responsive (it is what the
   # aim point uses) while omega must stay stiff (a spinner's rate is nearly
   # constant, and every rad/s of omega error becomes a whole horizon of phase
   # error - measured sigma(omega) was 0.69 rad/s, i.e. 15 deg of phase error at
   # 0.39 s). q_yaw_walk is additive, so q_yaw stays at its frozen value of 3.
   # Tuned on both configs (default.yaml and the frozen video_reference.yaml):
   # video 4 +2.5 pp in both, video 3 +0.5 / +0.4 pp. Larger walks help video 4
   # more but cost video 3 (q_yaw 1 + walk 0.12: 72.3% on video 4 but -2.5 pp on
   # video 3 under N0), so 0.05 is the cross-config compromise.
   q_yaw: 3.              # angular-rate diffusion (unchanged)
   q_yaw_walk: 0.05       # tuned: extra phase random walk (0 = old single-q model)
   # Let the yaw innovation (not the position one, which is blind to a phase
   # error) widen q_yaw on a target whose spin rate is genuinely changing.
   # +0.5 pp on N0 video 3, neutral on video 4, +1.9 pp on the simulator
   # (the two variable-rate scenarios), where it pays for most of the walk's cost.
   q_yaw_adapt: 1
   q_r: 3.0e-3           # radius process noise: apparent size changes when approaching
   q_dz: 1.0e-4
   pixel_noise: 1.0
   r_yaw: 0.01            # tuned: measured yaw scatter is ~5 deg
   r_yaw_head_on: 0.02
   init_radius: 0.25
   min_radius: 0.12
   max_radius: 0.4
   q_adapt_max: 20.
   nis_ema_alpha: 0.2
   # Singer velocity damping. Tuned on the two videos (sweep in README):
   # 0.3 s gives 66.6% / 65.4% (video 3 / video 4) vs 62.5% / 59.6% for the
   # constant-velocity model. The synthetic simulator prefers CV because its
   # strafing is a smooth sinusoid; the real robot reverses direction often.
   singer_tau: 0.3

ballistic:
   bullet_speed: 22.      # 17 mm MEASURED on the team's gun (legacy Base.h bullet_speed); setMeasuredBulletSpeed() still overrides at runtime
   gravity: 9.8
   drag_k: 0.019          # 17 mm: 0.5 * 1.169 * 0.47 * pi*0.0084^2 / 0.0032
   use_drag: 1
   bullet_mm: 17          # projectile class: 17, or 42 for the hero
   bullet_speed_42: 16.   # 42 mm placeholder - measure before use
   drag_k_42: 0.009       # 42 mm: same formula, m = 0.042 kg, r = 0.021 m

aimer:
   latency: 0.06
   yaw_offset_deg: 0.         # fixed mechanical zero offset; legacy code measured +0.5 in its own convention - re-measure before setting
   pitch_offset_deg: 0.       # legacy measured -0.5 in its own convention - re-measure before setting
   side_angle_deg: 20.        # tuned: higher = fewer but surer shots
   switch_hysteresis_deg: 3. # stay on the current plate unless the next is 3 deg better
   min_switch_omega: 1.0
   max_fire_facing_deg: 30.   # tuned: 15 -> 69% / 6.3 hits/s, 30 -> 63% / 9.0, 50 -> 58% / 10.7 (video 3)
   center_mode_omega: 12.     # armor mode matched or beat centre mode up to 10 rad/s
   center_fire_window_deg: 15.
   fire_tolerance_scale: 0.9
   fire_sigma_scale: 0.       # covariance fire gate; off: Q is tuned for response, not calibrated
   # Extra phase lead on the aimed plate (deg, same sign as omega). 0 = trust the
   # model: a +/-20 deg sweep is symmetric around -5..0 with the peak at ~57%,
   # so there is no systematic phase bias to correct on these recordings.
   phase_lead_deg: 0.
   gimbal_tau: 0.03
   gimbal_max_rate: 12.

eval:
   fps: 25.
   horizons: [ 0.12, 0.2, 0.32 ]
