<text x="470" y="372" font-size="11.5" text-anchor="middle" fill="#0d9488">2.7x faster</text>
<text x="770" y="92" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#111827">Detection / frame (ms)</text>
