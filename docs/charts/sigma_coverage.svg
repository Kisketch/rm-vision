<svg xmlns="http://www.w3.org/2000/svg" width="920" height="470" viewBox="0 0 920 470" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="920" height="470" fill="white"/>
<text x="24" y="30" font-size="17" font-weight="bold" fill="#111827">Sigma coverage: predicted vs actual (%)</text>
<text x="24" y="50" font-size="11.5" fill="#4b5563">The error distribution is a heavy-tailed mixture: no single scale calibrates 1-sigma and 2-sigma, and the weak mode hides inside the same sigma range -> fire gate stays OFF. Source: docs/sigma_coverage_study.md</text>
<line x1="70" y1="372" x2="890" y2="372" stroke="#e5e7eb"/>
<text x="64" y="376" font-size="10.5" text-anchor="end" fill="#4b5563">0%</text>
<line x1="70" y1="300" x2="890" y2="300" stroke="#e5e7eb"/>
<text x="64" y="304" font-size="10.5" text-anchor="end" fill="#4b5563">25%</text>
<line x1="70" y1="228" x2="890" y2="228" stroke="#e5e7eb"/>
<text x="64" y="232" font-size="10.5" text-anchor="end" fill="#4b5563">50%</text>
<line x1="70" y1="156" x2="890" y2="156" stroke="#e5e7eb"/>
<text x="64" y="160" font-size="10.5" text-anchor="end" fill="#4b5563">75%</text>
<line x1="70" y1="84" x2="890" y2="84" stroke="#e5e7eb"/>
<text x="64" y="88" font-size="10.5" text-anchor="end" fill="#4b5563">100%</text>
<rect x="190" y="133" width="110" height="239" fill="#0d9488"/>
<text x="245" y="127" font-size="13" text-anchor="middle" fill="#111827">83</text>
<text x="245" y="392" font-size="11.5" text-anchor="middle" fill="#111827">1-sigma, all modes</text>
<text x="245" y="410" font-size="10.5" text-anchor="middle" fill="#4b5563">nominal 68.3</text>
<rect x="440" y="115" width="110" height="257" fill="#2563eb"/>
<text x="495" y="109" font-size="13" text-anchor="middle" fill="#111827">89.3</text>
<text x="495" y="392" font-size="11.5" text-anchor="middle" fill="#111827">2-sigma, all modes</text>
<text x="495" y="410" font-size="10.5" text-anchor="middle" fill="#4b5563">nominal 95.4</text>
<rect x="690" y="326" width="110" height="46" fill="#dc2626"/>
<text x="745" y="320" font-size="13" text-anchor="middle" fill="#111827">16</text>
<text x="745" y="392" font-size="11.5" text-anchor="middle" fill="#111827">1-sigma, pure strafe only</text>
<text x="745" y="410" font-size="10.5" text-anchor="middle" fill="#4b5563">range 15-17</text>
<line x1="70" y1="175" x2="890" y2="175" stroke="#d97706" stroke-dasharray="6 4"/>
<text x="894" y="179" font-size="10" fill="#d97706">nominal 1-sigma 68.3</text>
<line x1="70" y1="97" x2="890" y2="97" stroke="#d97706" stroke-dasharray="6 4"/>
<text x="894" y="101" font-size="10" fill="#d97706">nominal 2-sigma 95.4</text>
</svg>
