<svg xmlns="http://www.w3.org/2000/svg" width="920" height="500" viewBox="0 0 920 500" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="920" height="500" fill="#0f172a"/>
<text x="24" y="30" font-size="17" font-weight="bold" fill="#e2e8f0">Main camera bandwidth at 165 fps (Bayer8, uncompressed)</text>
<text x="24" y="50" font-size="11.5" fill="#94a3b8">The camera is USB 3.0 but the team's VM link is USB 2.0 (~40 MB/s effective): at 1440x1080 the link caps the stream near 26 fps. Formula and context: docs/calibration/camera_hardware.md</text>
