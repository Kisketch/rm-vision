<line x1="230" y1="235" x2="123.1" y2="284.9" stroke="#334155" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="170.6" y1="147.9" x2="201.5" y2="133.6" stroke="#7c5a1a" stroke-width="7" stroke-linecap="round"/>
<line x1="230" y1="235" x2="186.0" y2="140.7" stroke="#334155" stroke-width="1" stroke-dasharray="3 3"/>
<text x="294.8" y="203.6" font-size="12" fill="#e2e8f0" text-anchor="start" font-weight="bold">r1</text>
<text x="260.2" y="282.8" font-size="12" fill="#e2e8f0" text-anchor="start" font-weight="bold">r2</text>
<text x="137.1" y="314.9" font-size="10.5" fill="#94a3b8" text-anchor="start" font-weight="normal">plate k = 2</text>
<text x="212.0" y="134.7" font-size="10.5" fill="#94a3b8" text-anchor="start" font-weight="normal">plate k = 3</text>
