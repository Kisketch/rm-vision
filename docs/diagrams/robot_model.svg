<text x="296.0" y="225.0" font-size="11.5" fill="#14b8a6" text-anchor="start" font-weight="normal">yaw θ</text>
<path d="M84.5,319.0 A168,168 0 0,1 77.7,164.0" fill="none" stroke="#14b8a6" stroke-width="2" marker-end="url(#at)"/>
<text x="38.0" y="241.0" font-size="16" fill="#14b8a6" text-anchor="end" font-weight="bold">ω</text>
<polygon points="216,425 244,425 238,411 222,411" fill="#3b82f6"/>
<text x="250.0" y="421.0" font-size="11" fill="#3b82f6" text-anchor="start" font-weight="normal">camera</text>
<line x1="230" y1="411" x2="336.9" y2="185.1" stroke="#3b82f6" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="230" y1="411" x2="274.0" y2="329.3" stroke="#3b82f6" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="470" y="78" width="426" height="236" rx="8" fill="#16213a" stroke="#334155" stroke-width="1.5"/>
<text x="486.0" y="104.0" font-size="13" fill="#e2e8f0" text-anchor="start" font-weight="bold">13 states (core/include/autoaim/tracker.hpp)</text>
<text x="486.0" y="136.0" font-size="11.5" fill="#94a3b8" text-anchor="start" font-weight="normal">centre position</text>
<text x="610.0" y="136.0" font-size="12" fill="#3b82f6" text-anchor="start" font-weight="normal">xc  yc  zc</text>
<text x="486.0" y="170.0" font-size="11.5" fill="#94a3b8" text-anchor="start" font-weight="normal">centre velocity</text>
<text x="610.0" y="170.0" font-size="12" fill="#3b82f6" text-anchor="start" font-weight="normal">vxc  vyc  vzc   (Singer-damped, τ = 0.3 s)</text>
<text x="486.0" y="204.0" font-size="11.5" fill="#94a3b8" text-anchor="start" font-weight="normal">spin</text>
<text x="610.0" y="204.0" font-size="12" fill="#14b8a6" text-anchor="start" font-weight="normal">yaw θ,  ω</text>
<text x="486.0" y="238.0" font-size="11.5" fill="#94a3b8" text-anchor="start" font-weight="normal">body geometry</text>
<text x="610.0" y="238.0" font-size="12" fill="#f59e0b" text-anchor="start" font-weight="normal">r1, r2 (two plate radii),  dz (2nd-pair height)</text>
<text x="486.0" y="272.0" font-size="11.5" fill="#94a3b8" text-anchor="start" font-weight="normal">CA extension</text>
<text x="610.0" y="272.0" font-size="12" fill="#94a3b8" text-anchor="start" font-weight="normal">axc  ay   (off by default — rejected on video)</text>
<text x="486.0" y="300.0" font-size="11" fill="#e2e8f0" text-anchor="start" font-weight="normal">Plate k sits at yaw θ + k·π/2 on radius r1 (k even) or r2 (k odd).</text>
<rect x="470" y="330" width="426" height="82" rx="8" fill="#16213a" stroke="#14b8a6" stroke-width="1.5"/>
<text x="486.0" y="354.0" font-size="12" fill="#14b8a6" text-anchor="start" font-weight="bold">Estimated on the reference videos</text>
<text x="486.0" y="376.0" font-size="11.5" fill="#e2e8f0" text-anchor="start" font-weight="normal">3.avi   r1 0.243 m   r2 0.210 m   dz 0.050 m   ω ≈ 2.6 rad/s</text>
<text x="486.0" y="396.0" font-size="11.5" fill="#e2e8f0" text-anchor="start" font-weight="normal">4.avi   r1 0.239 m   r2 0.214 m   dz 0.046 m   ω ≈ 8.3 rad/s</text>
</svg>
