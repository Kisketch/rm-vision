<text x="630.0" y="324.0" font-size="11.5" fill="#94a3b8" text-anchor="middle" font-weight="normal">t_e + D  (frame reaches host)</text>
<line x1="300" y1="340" x2="630" y2="340" stroke="#94a3b8" stroke-width="1.2" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="465.0" y="356.0" font-size="11" fill="#94a3b8" text-anchor="middle" font-weight="normal">D = transport + processing delay (measured on the robot by DelayCalibrator)</text>
