<text x="640.0" y="207.0" font-size="11.5" fill="#ef4444" text-anchor="start" font-weight="normal">receipt-time lookup (old code):</text>
<text x="640.0" y="223.0" font-size="11.5" fill="#ef4444" text-anchor="start" font-weight="normal">attitude already moved by ω_g · D</text>
<rect x="560" y="62" width="330" height="40" rx="6" fill="#2a1418" stroke="#ef4444" stroke-width="1.5"/>
<text x="725.0" y="80.0" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="bold">6 rad/s × 10 ms = 3.4° of aim error</text>
<text x="725.0" y="95.0" font-size="11" fill="#94a3b8" text-anchor="middle" font-weight="normal">≈ 30 cm at 5 m — larger than a plate</text>
