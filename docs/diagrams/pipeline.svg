<svg xmlns="http://www.w3.org/2000/svg" width="920" height="360" viewBox="0 0 920 360" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#14b8a6"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef4444"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker></defs>
<rect width="920" height="360" fill="#0f172a"/>
<text x="24" y="30" font-size="17" font-weight="bold" fill="#e2e8f0">Pipeline: one frame, from photons to a fire command</text>
<text x="24" y="50" font-size="11.5" fill="#94a3b8">Per-stage cost single-threaded (README, Timing). Dashed: sentry-only feedback. Exposure stamps travel with every observation.</text>
<rect x="28" y="92" width="124" height="92" rx="8" fill="#16213a" stroke="#3b82f6" stroke-width="1.5"/>
<text x="90.0" y="118.0" font-size="14" fill="#3b82f6" text-anchor="middle" font-weight="bold">Camera</text>
<text x="90.0" y="142.0" font-size="11.5" fill="#e2e8f0" text-anchor="middle" font-weight="normal">frame +</text>
<text x="90.0" y="158.0" font-size="11.5" fill="#e2e8f0" text-anchor="middle" font-weight="normal">exposure stamp</text>
<line x1="154.0" y1="138.0" x2="173.0" y2="138.0" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="175" y="92" width="124" height="92" rx="8" fill="#16213a" stroke="#f59e0b" stroke-width="1.5"/>
<text x="237.0" y="118.0" font-size="14" fill="#f59e0b" text-anchor="middle" font-weight="bold">Detector</text>
<text x="237.0" y="142.0" font-size="11.5" fill="#e2e8f0" text-anchor="middle" font-weight="normal">light bars → pairs</text>
<text x="237.0" y="158.0" font-size="11.5" fill="#e2e8f0" text-anchor="middle" font-weight="normal">corners → MLP digit</text>
<text x="237.0" y="202.0" font-size="11" fill="#94a3b8" text-anchor="middle" font-weight="normal">3–6 ms</text>
<line x1="301.0" y1="138.0" x2="320.0" y2="138.0" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="322" y="92" width="124" height="92" rx="8" fill="#16213a" stroke="#f59e0b" stroke-width="1.5"/>
<text x="384.0" y="118.0" font-size="14" fill="#f59e0b" text-anchor="middle" font-weight="bold">Pose</text>
<text x="384.0" y="142.0" font-size="11.5" fill="#e2e8f0" text-anchor="middle" font-weight="normal">IPPE PnP, 2 poses</text>
<text x="384.0" y="158.0" font-size="11.5" fill="#e2e8f0" text-anchor="middle" font-weight="normal">→ yaw search</text>
<text x="384.0" y="202.0" font-size="11" fill="#94a3b8" text-anchor="middle" font-weight="normal">≈ 72 µs</text>
<line x1="448.0" y1="138.0" x2="467.0" y2="138.0" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="469" y="92" width="124" height="92" rx="8" fill="#16213a" stroke="#14b8a6" stroke-width="1.5"/>
<text x="531.0" y="118.0" font-size="14" fill="#14b8a6" text-anchor="middle" font-weight="bold">Tracker</text>
<text x="531.0" y="142.0" font-size="11.5" fill="#e2e8f0" text-anchor="middle" font-weight="normal">13-state</text>
<text x="531.0" y="158.0" font-size="11.5" fill="#e2e8f0" text-anchor="middle" font-weight="normal">whole-robot EKF</text>
<text x="531.0" y="202.0" font-size="11" fill="#94a3b8" text-anchor="middle" font-weight="normal">&lt; 0.5 ms*</text>
<line x1="595.0" y1="138.0" x2="614.0" y2="138.0" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="616" y="92" width="124" height="92" rx="8" fill="#16213a" stroke="#14b8a6" stroke-width="1.5"/>
<text x="678.0" y="118.0" font-size="14" fill="#14b8a6" text-anchor="middle" font-weight="bold">Aimer</text>
<text x="678.0" y="142.0" font-size="11.5" fill="#e2e8f0" text-anchor="middle" font-weight="normal">ballistics RK4 +</text>
<text x="678.0" y="158.0" font-size="11.5" fill="#e2e8f0" text-anchor="middle" font-weight="normal">fire window</text>
<text x="678.0" y="202.0" font-size="11" fill="#94a3b8" text-anchor="middle" font-weight="normal">≈ 40 µs / solve</text>
<line x1="742.0" y1="138.0" x2="761.0" y2="138.0" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="763" y="92" width="124" height="92" rx="8" fill="#16213a" stroke="#3b82f6" stroke-width="1.5"/>
<text x="825.0" y="118.0" font-size="14" fill="#3b82f6" text-anchor="middle" font-weight="bold">MCU</text>
<text x="825.0" y="142.0" font-size="11.5" fill="#e2e8f0" text-anchor="middle" font-weight="normal">yaw/pitch + rates</text>
<text x="825.0" y="158.0" font-size="11.5" fill="#e2e8f0" text-anchor="middle" font-weight="normal">fire flag</text>
<rect x="292" y="252" width="478" height="70" rx="8" fill="#16213a" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="0"/>
<text x="531.0" y="276.0" font-size="13" fill="#3b82f6" text-anchor="middle" font-weight="bold">PoseBuffer — gimbal attitude ring buffer</text>
<text x="531.0" y="296.0" font-size="11.5" fill="#e2e8f0" text-anchor="middle" font-weight="normal">quaternion SLERP at each frame's exposure instant;</text>
<text x="531.0" y="312.0" font-size="11.5" fill="#e2e8f0" text-anchor="middle" font-weight="normal">no bracketing sample → frame dropped, never aimed from a wrong pose</text>
<line x1="825.0" y1="210" x2="825.0" y2="289.0" stroke="#94a3b8" stroke-width="1.6"/>
<line x1="825.0" y1="289.0" x2="772" y2="289.0" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)"/>
<text x="817.0" y="240.0" font-size="10.5" fill="#94a3b8" text-anchor="end" font-weight="normal">17-byte attitude frames</text>
<line x1="384.0" y1="250.0" x2="384.0" y2="210.0" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M531.0,90 C531.0,62 237.0,62 237.0,88" fill="none" stroke="#14b8a6" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#at)"/>
<text x="384.0" y="66.0" font-size="10.5" fill="#14b8a6" text-anchor="middle" font-weight="normal">predicted ROI windows (sentry): detection 1.3–1.6 ms</text>
<text x="24.0" y="350.0" font-size="10" fill="#94a3b8" text-anchor="start" font-weight="normal">* tracker + aimer + shot judge combined. Detector: 6.3 ms in the Timing table, 3.4 ms on the Linux box used for Quick start.</text>
</svg>
