%YAML:1.0
---
# Sentry configuration for the integrated vision pipeline.
# Values without a comment are the tuned defaults from rm-autoaim; the sentry
# specifics (extrinsics, outpost, multi-target) are marked.
#
# IMPORTANT: fill camera.R_cam2gimbal / t_cam2gimbal from a real measurement.
# The default (empty R) keeps the old fixed-camera video convention and is only
# valid for the 3.avi / 4.avi offline evaluation.

camera:
   fx: 2400.
   fy: 2400.
   cx: 720.
   cy: 540.
   dist: [ 0., 0., 0., 0., 0. ]
   pitch_deg: 0.
   # Row-major camera-optical -> gimbal rotation.  Empty = build from pitch_deg.
   # Example (camera looking forward, optical axes rotated into gimbal axes):
   # R_cam2gimbal: [ 0., 0., 1., -1., 0., 0., 0., -1., 0. ]
   # t_cam2gimbal: [ 0.10, -0.05, 0. ]
   t_cam2gimbal: [ 0., 0., 0. ]

detector:
   enemy_color: "red"
   channel_diff_threshold: 70
   min_light_length: 8.
   min_light_aspect: 1.6
   max_light_aspect: 12.
   min_fill_ratio: 0.4
   max_light_tilt_deg: 40.
   max_pair_angle_diff_deg: 12.
   max_length_ratio: 1.7
   max_center_y_diff: 0.6
   min_gap_ratio: 0.15
   max_gap_ratio: 3.2
   min_plate_ratio: 1.1
   max_plate_ratio: 5.0
   large_plate_ratio: 3.2
   reject_contained_lights: 1
   refine_corners: 1
   classify_threshold: 0.7
   ignore_classes: [ "negative" ]

pose:
   optimize_yaw: 1
   armor_pitch_deg: 15.
   # The outpost plate leans the other way (old sentry used 11*pi/12 vs 13*pi/12).
   outpost_armor_pitch_deg: -15.
   outpost_as_large: 1
   yaw_search_range_deg: 85.
   yaw_gain: 1.3

tracker:
   armors_num: 4
   max_match_distance: 0.35
   max_match_yaw_diff: 1.0
   tracking_thres: 3
   lost_time_thres: 0.4
   q_xyz: 1.0
   q_yaw: 3.
   q_yaw_walk: 0.05
   q_yaw_adapt: 1
   q_r: 3.0e-3
   q_dz: 1.0e-4
   pixel_noise: 1.0
   r_yaw: 0.01
   r_yaw_head_on: 0.02
   init_radius: 0.25
   min_radius: 0.12
   max_radius: 0.4
   q_adapt_max: 20.
   nis_ema_alpha: 0.2
   # rm-vision merge: the unified tracker defaults carry_velocity on (infantry
   # behaviour); the sentry pipeline never had it, keep it off here.
   carry_velocity: 0
   singer_tau: 0.3
   ca_model: 0.
   q_acc: 2.
   # Outpost: one radius, three heights.
   outpost_init_radius: 0.225
   outpost_min_radius: 0.12
   outpost_max_radius: 0.4
   q_outpost_z: 2.5e-4
   q_outpost_r: 1.0e-4

target:
   max_distance: 10.
   lost_keep_time: 1.0
   association_gate: 1.0   # legacy, unused: one track per identity (see docs/review_2026-11.md)
   switch_margin: 0.5
   require_tracking: 1
   # Earlier entries win.  A sentry is threatened by shooters, not by the
   # outpost: shoot 3/4 first, keep outpost last (it is 2000 HP and rarely a
   # threat).  Reorder per match rule if the sentry is tasked with the base.
   priority: [ "3", "4", "1", "2", "guard", "base", "outpost" ]

ballistic:
   bullet_speed: 25.
   gravity: 9.8
   drag_k: 0.019
   use_drag: 1

aimer:
   latency: 0.06
   side_angle_deg: 20.
   switch_hysteresis_deg: 3.
   min_switch_omega: 1.0
   max_fire_facing_deg: 30.
   center_mode_omega: 12.
   center_fire_window_deg: 15.
   fire_tolerance_scale: 0.9
   fire_sigma_scale: 0.
   gimbal_tau: 0.03
   gimbal_max_rate: 12.
   # Mechanical trim added to the final command (deg); measure on the robot.
   yaw_offset_deg: 0.
   pitch_offset_deg: 0.

eval:
   fps: 25.
   horizons: [ 0.12, 0.2, 0.32 ]
