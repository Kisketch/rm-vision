name: Shared core sync

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  shared-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - name: Checkout sibling repository
        uses: actions/checkout@v5
        with:
          repository: Kisketch/rm-autoaim
          path: sibling

      - name: Compare the byte-identical shared-core set
        run: bash tools/check_shared_core.sh sibling
